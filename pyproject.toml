[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ayuvara"
version = "2.1.0"
description = "Autonomous Elderly Care & Medication Management Platform"
authors = [
    { name = "AYUVARA Health Innovations" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.4",
    "starlette>=0.36.3",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", "dist", "node_modules"]

[tool.black]
line-length = 100
target-version = ['py310']

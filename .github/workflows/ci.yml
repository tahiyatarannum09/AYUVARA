name: AYUVARA CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install fastapi uvicorn sqlalchemy aiosqlite pydantic starlette httpx

    - name: Execute Automated Platform Test Suite
      run: |
        cd backend
        python -m unittest tests.test_platform

  frontend-build:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package.json'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Compile & Verify Production Assets
      run: |
        cd frontend
        npm run build
